[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-panel"
version = "0.1.0"
description = "Paired fixed-code multi-agent review experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hf = ["torch>=2.14.1,<2.16", "transformers==5.22.1"]

[project.scripts]
mas-panel = "mas_panel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
